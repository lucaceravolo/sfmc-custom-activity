[build]
  publish = "public"
  functions = "netlify/functions"

# Custom Activity v3 (gia' funzionante)
[[redirects]]
  from = "/activity-v3/config.json"
  to = "/.netlify/functions/config-v3"
  status = 200
  force = true

# Custom Entry Source v2 (nuovo percorso)
[[redirects]]
  from = "/entry-source-v2/config.json"
  to = "/.netlify/functions/config-entry-v2"
  status = 200
  force = true

# Nuovo URL per richiedere la configurazione aggiornata
[[redirects]]
  from = "/entry-source-refresh/config.json"
  to = "/.netlify/functions/config-entry-v2"
  status = 200
  force = true

[[redirects]]
  from = "/entry-source-refresh/"
  to = "/entry-source-v2/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/entry-source-refresh/*"
  to = "/entry-source-v2/:splat"
  status = 200
  force = true
